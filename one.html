<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Play Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center mb-6">Football Play Tracker</h1>
        <div class="space-y-4">
            <div>
                <label for="lineOfScrimmage" class="block text-sm font-medium text-gray-700">Line of Scrimmage</label>
                <input
                    type="text"
                    id="lineOfScrimmage"
                    placeholder="Enter yard line (e.g., 20)"
                    class="input input-bordered w-full"
                />
            </div>
            <div>
                <label for="downOn" class="block text-sm font-medium text-gray-700">Down On</label>
                <input
                    type="text"
                    id="downOn"
                    placeholder="Enter down (e.g., 1st, 2nd)"
                    class="input input-bordered w-full"
                />
            </div>
        </div>
    </div>
</body>
</html>
