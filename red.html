<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Play Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="bg-gradient-to-br from-amber-900 to-brown-800 min-h-screen p-4">
    <div class="w-full max-w-md mx-auto bg-brown-100 rounded-xl shadow-lg p-6 mt-4">
        <h1 class="text-2xl font-bold text-center mb-4 text-brown-800">Football Play Tracker</h1>
        <div class="space-y-4">
            <div>
                <label for="lineOfScrimmage" class="block text-sm font-semibold text-brown-700">Line of Scrimmage</label>
                <input
                    type="text"
                    id="lineOfScrimmage"
                    placeholder="Enter yard line (e.g., 20)"
                    class="input input-bordered w-full bg-brown-50 text-brown-800 border-brown-500 focus:ring-2 focus:ring-brown-600"
                />
            </div>
            <div>
                <label for="downOn" class="block text-sm font-semibold text-brown-700">Down On</label>
                <input
                    type="text"
                    id="downOn"
                    placeholder="Enter down (e.g., 1st, 2nd)"
                    class="input input-bordered w-full bg-brown-50 text-brown-800 border-brown-500 focus:ring-2 focus:ring-brown-600"
                />
            </div>
        </div>
    </div>
</body>
</html>
