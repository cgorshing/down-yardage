<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Play Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="bg-gradient-to-br from-blue-900 to-gray-800 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-gray-900 text-white rounded-xl shadow-2xl p-8">
        <h1 class="text-3xl font-extrabold text-center mb-8 text-blue-300">Football Play Tracker</h1>
        <div class="space-y-6">
            <div>
                <label for="lineOfScrimmage" class="block text-sm font-semibold text-blue-200">Line of Scrimmage</label>
                <input
                    type="text"
                    id="lineOfScrimmage"
                    placeholder="Enter yard line (e.g., 20)"
                    class="input input-bordered w-full bg-gray-800 text-white border-blue-500 focus:ring-2 focus:ring-blue-400"
                />
            </div>
            <div>
                <label for="downOn" class="block text-sm font-semibold text-blue-200">Down On</label>
                <input
                    type="text"
                    id="downOn"
                    placeholder="Enter down (e.g., 1st, 2nd)"
                    class="input input-bordered w-full bg-gray-800 text-white border-blue-500 focus:ring-2 focus:ring-blue-400"
                />
            </div>
        </div>
    </div>
</body>
</html>
